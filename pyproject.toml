[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-toolkit"
version = "0.1.0"
description = "Score RAG pipelines on retrieval quality, faithfulness and answer quality, with HTML reports and a CI quality gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mahnoor Amjad" }]
keywords = ["rag", "llm", "evaluation", "llm-as-judge", "retrieval"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=1.0"]
all = ["openai>=1.40", "anthropic>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rageval = "rageval.cli:app"

[tool.setuptools.packages.find]
include = ["rageval*", "api*"]

[tool.setuptools.package-data]
rageval = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
